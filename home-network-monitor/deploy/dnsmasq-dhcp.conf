# dnsmasq as a DHCP-only server on the monitor box, for AT&T gateways whose
# DHCP server can't hand out a custom DNS server. Turn the gateway's DHCP off
# first (see README, Step 2, Option B), then:
#
#   sudo apt install dnsmasq
#   sudo cp deploy/dnsmasq-dhcp.conf /etc/dnsmasq.d/netmon-dhcp.conf
#   sudo systemctl restart dnsmasq
#
# Replace 192.168.1.10 with the monitor's static IP.

# DHCP only: netmon's DNS proxy owns port 53.
port=0

interface=eth0
bind-dynamic

dhcp-range=192.168.1.64,192.168.1.253,255.255.255.0,24h
dhcp-option=option:router,192.168.1.254
dhcp-option=option:dns-server,192.168.1.10
dhcp-authoritative

# Point collectors.discovery.dhcp_leases_file at this so netmon picks up
# the hostnames devices send when they request an address.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
